name: Release

# prepare-release.yml が作る `chore(release): vX.Y.Z` PR のマージ（main への push）で起動する。
# tag と GitHub Release の作成・公開を行う。

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@b155081b04cae981e8ae3beeb37aa1c024866ea2 # v3.3.0
    permissions:
      contents: write
    with:
      draft: false
