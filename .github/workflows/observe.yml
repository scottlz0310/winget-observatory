name: Observe Winget Queue

# 4時間おきの cron 実行または手動起動により、microsoft/winget-pkgs のメトリクスを収集する。
# 生データ（CSV/JSONL/JSON）は Dropbox App folder へ保存し、ダッシュボードは GitHub Pages へ公開する。
# main ブランチへの git push は行わず、contents: read で安全に実行する。

on:
  schedule:
    # 4時間おき（15分）に実行
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      target_pr:
        description: "ターゲットPR番号（空欄時はスクリプト既定値）"
        required: false
        default: "464302"
      repository:
        description: "対象リポジトリ"
        required: false
        default: "microsoft/winget-pkgs"

concurrency:
  group: observe-winget-queue
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  observe:
    name: Collect Metrics, Save to Dropbox & Deploy Dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download latest history data from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction download

      - name: Run Winget Observatory Scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TARGET_PR: ${{ inputs.target_pr || '464302' }}
          WINGET_REPOSITORY: ${{ inputs.repository || 'microsoft/winget-pkgs' }}
        run: |
          echo "Target PR: $WINGET_TARGET_PR"
          echo "Repository: $WINGET_REPOSITORY"

          # 1. 進捗メトリクス計測（CSVログ追記 & JSONスナップショット生成）
          echo "=== Running progress CLI ==="
          bun run src/cli/progress.ts \
            --target-pr "$WINGET_TARGET_PR" \
            --repo "$WINGET_REPOSITORY" \
            --log-path "data/progress-history.csv" \
            --snapshot-path "data/latest-progress.json"

          # 2. キュー境界探索（JSONL追記 & 最新JSONスナップショット生成）
          echo "=== Running explore-depths CLI ==="
          bun run src/cli/explore-depths.ts \
            --target-pr "$WINGET_TARGET_PR" \
            --repository "$WINGET_REPOSITORY" \
            --history-path "data/depths-history.jsonl" \
            --output-path "data/latest-depths.json"

      - name: Save updated metrics to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction upload

      - name: Build Dashboard for GitHub Pages
        run: bun run scripts/build-pages.ts --data-dir data --output-dir site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
