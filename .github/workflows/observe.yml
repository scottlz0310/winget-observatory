name: Observe Winget Queue

# 定期実行または手動起動により、microsoft/winget-pkgs のメトリクスを収集する。
# 生データ（CSV/JSONL/JSON）は Dropbox App folder へ保存し、ダッシュボードは GitHub Pages へ公開する。
# main ブランチへの git push は行わず、contents: read で安全に実行する。

on:
  # 定期実行は Cloudflare Workers の Cron Trigger (workers/observe-trigger) が dispatch する。
  # Actions の schedule は間引き・遅延されるため使わない。
  workflow_dispatch:
    inputs:
      target_pr:
        description: "ターゲットPR番号（空欄時はスクリプト既定値）"
        required: false
        default: "464302"
      repository:
        description: "対象リポジトリ"
        required: false
        default: "microsoft/winget-pkgs"

concurrency:
  group: observe-winget-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    name: Collect Metrics & Save to Dropbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download latest history data from Dropbox
        id: download_dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction download

      # 1. 進捗メトリクス計測（CSVログ追記 & JSONスナップショット生成 & サンプルキャッシュ蓄積）
      - name: Run progress CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TARGET_PR: ${{ inputs.target_pr || '464302' }}
          WINGET_REPOSITORY: ${{ inputs.repository || 'microsoft/winget-pkgs' }}
        run: |
          echo "Target PR: $WINGET_TARGET_PR"
          echo "Repository: $WINGET_REPOSITORY"

          echo "=== Running progress CLI ==="
          bun run src/cli/progress.ts \
            --target-pr "$WINGET_TARGET_PR" \
            --repo "$WINGET_REPOSITORY" \
            --log-path "data/progress-history.csv" \
            --snapshot-path "data/latest-progress.json" \
            --cache-path "data/merged-samples.jsonl"

      # progress で蓄積されたサンプルキャッシュ・進捗データを即座に Dropbox へ同期保存
      - name: Save progress cache and metrics to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction upload

      # 2. キュー境界探索（JSONL追記 & 最新JSONスナップショット生成）
      - name: Run explore-depths CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TARGET_PR: ${{ inputs.target_pr || '464302' }}
          WINGET_REPOSITORY: ${{ inputs.repository || 'microsoft/winget-pkgs' }}
        run: |
          echo "=== Running explore-depths CLI ==="
          bun run src/cli/explore-depths.ts \
            --target-pr "$WINGET_TARGET_PR" \
            --repository "$WINGET_REPOSITORY" \
            --history-path "data/depths-history.jsonl" \
            --output-path "data/latest-depths.json"

      # explore-depths で更新された境界探索データも含め Dropbox へ保存。
      # explore-depths が失敗した場合でも、ダウンロード済み／更新済みのキャッシュ・メトリクスを失わないよう always() で保証する。
      - name: Save updated metrics to Dropbox
        if: always() && steps.download_dropbox.outcome == 'success'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction upload

      # 計測結果を先に保存してから予想日を記録する（予想の記録が失敗しても計測は失われない）
      - name: Record forecast history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TARGET_PR: ${{ inputs.target_pr || '464302' }}
          WINGET_REPOSITORY: ${{ inputs.repository || 'microsoft/winget-pkgs' }}
        run: bun run src/cli/record-forecast.ts --target-pr "$WINGET_TARGET_PR" --repo "$WINGET_REPOSITORY"

      - name: Save forecast history to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: bun run scripts/sync-dropbox.ts --direction upload

      - name: Build Dashboard for GitHub Pages
        run: bun run scripts/build-pages.ts --data-dir data --output-dir site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # デプロイは別ジョブに分離する。デプロイだけ失敗した場合に、10分かかる収集を
  # やり直さず「失敗したジョブのみ再実行」で復旧できるようにするため。
  deploy:
    name: Deploy Dashboard to GitHub Pages
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read # アーティファクト登録確認 (gh api) に必要
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # upload-pages-artifact 完了直後は、アーティファクトのメタデータが API に反映される前に
      # deploy-pages が走り "No artifacts named github-pages were found" で失敗することがある (#142)。
      # deploy-pages 側にはリトライがないため、直前で指数バックオフにより登録を待つ。
      # 反映済みなら 1 回目で抜けるので、通常時の待ち時間は発生しない。
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          delays=(1 2 4 8 16 30 60)
          for i in "${!delays[@]}"; do
            # 期限切れ (expired) のものは数えない
            count=$(gh api "$url" --jq '[.artifacts[] | select(.expired | not)] | length' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "Artifact 'github-pages' registered (attempt $((i + 1)))."
              exit 0
            fi
            # 最終試行の後は待っても確認が走らないため sleep しない
            if [ "$i" -lt "$((${#delays[@]} - 1))" ]; then
              echo "Artifact not registered yet (attempt $((i + 1))/${#delays[@]}); retrying in ${delays[$i]}s..."
              sleep "${delays[$i]}"
            fi
          done
          echo "::error::Artifact 'github-pages' was not registered within the wait window."
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | {name, id, expired, created_at}' || true
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
