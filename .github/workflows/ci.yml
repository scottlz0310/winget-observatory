name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov への OIDC 認証 (トークンレス) に必要
  id-token: write

jobs:
  biome:
    name: Biome & TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Lint と Formatting を検査
        run: bun run check

      - name: 型チェック
        run: bun run typecheck

      - name: ユニットテストを実行 (カバレッジ計測)
        run: bun run test:coverage

      - name: verify-gate 配布バンドルのビルドと Node.js スモーク検証
        run: |
          set -euo pipefail
          bun run build:verify-gate
          PKG_VER="$(node -p "require('./package.json').version")"
          OUT_VER="$(node packages/verify-gate/dist/cli.mjs --version)"
          echo "Built CLI version: $OUT_VER"
          test "$OUT_VER" = "winget-verify-gate $PKG_VER"
          node packages/verify-gate/dist/cli.mjs skill list --json | node -e '
            const data = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (!Array.isArray(data.skills) || data.skills.length !== 1 || data.skills[0].resources.length !== 3) {
              throw new Error("Unexpected skill list output");
            }
          '

      - name: Codecov へカバレッジをアップロード
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
