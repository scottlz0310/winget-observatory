name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov への OIDC 認証 (トークンレス) に必要
  id-token: write

jobs:
  biome:
    name: Biome & TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Lint と Formatting を検査
        run: bun run check

      - name: ユニットテストを実行 (カバレッジ計測)
        run: bun run test:coverage

      - name: Codecov へカバレッジをアップロード
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
